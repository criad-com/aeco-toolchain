# Off-Windows compile-check for the aeco Windows add-ins (loop #3, compile-only).
#
# Compiles addins-codex/{UsdAecoRevit,UsdAecoNavis} reference-only against the
# vendored Autodesk DLLs, on a Linux runner — no Windows host needed. This gives
# the fleet instant compile feedback; the add-ins still only RUN on Windows.
#
# RUNNER REQUIREMENTS:
#   * A Linux act_runner (label `linux-builder` below — adjust to your fleet's
#     actual Linux label). Needs: bash, curl, and either a preinstalled .NET SDK
#     10.x OR outbound HTTPS so run-compile-check.sh --install-sdk can fetch one
#     into $HOME/.dotnet (no sudo).
#   * Access to the Autodesk reference DLLs. Two supported options, matching the
#     policy note in vendor/autodesk-refs/README.md:
#       (a) FETCH  — keyless SSH from the runner to example-revit/example-navis as $SSH_USER,
#                    so `--fetch` can scp the DLLs at build time (nothing
#                    proprietary is committed). This is the default wiring below.
#       (b) COMMIT — if the DLLs are committed into this (private) repo, drop the
#                    `--fetch` flag; the checkout already contains them.
#
# Because addins-codex is a SEPARATE repo, the job checks it out next to this one.
name: addins-compile-check

on:
  pull_request:
  workflow_dispatch:

jobs:
  compile-check:
    runs-on: linux-builder
    env:
      SSH_USER: ${{ vars.SSH_USER }}
      REVIT_HOST: ${{ vars.REVIT_HOST }}
      NAVIS_HOST: ${{ vars.NAVIS_HOST }}
    steps:
      - name: checkout aeco-toolchain
        run: |
          set -euo pipefail
          git clone --depth 1 "${{ github.server_url }}/aeco/aeco-toolchain.git" toolchain
          # PR head checkout omitted for brevity; mirror pr.yml's validated
          # head-repo/ref/sha fetch when enabling on real PRs.

      - name: checkout addins-codex (sibling)
        run: |
          set -euo pipefail
          git clone --depth 1 "${{ github.server_url }}/aeco/addins-codex.git" addins-codex

      - name: compile-check (install SDK + fetch DLLs as needed)
        run: |
          set -euo pipefail
          toolchain/tools/compile-check/autodesk-addins/run-compile-check.sh \
            --install-sdk \
            --fetch \
            --addins-repo "$PWD/addins-codex"
