# Toolchain flake checks cover pxr-import smoke, drift, and embed-spike;
# lintConventions joins after P0-9 merges. Nix store hits keep re-checks cheap.

name: pr

on:
  pull_request:

jobs:
  flake-check:
    runs-on: studio
    steps:
      # One step, no JS actions: the studio runner is host-mode with a
      # minimal PATH (no node), and nix can fetch the PR head itself over
      # the same ~/.netrc auth the flake inputs use (see README).
      #
      # The head repository, branch and commit come from the event payload
      # — not from GITHUB_REPOSITORY (the *base* repo; wrong for fork PRs)
      # nor from bare GITHUB_HEAD_REF interpolation. All three values are
      # validated against strict charsets before they re-enter the URL.
      # The fetch names both ref and rev: the ref makes the commit
      # protocol-reachable on any git server (an omitted ref means
      # repository HEAD, which does not contain an unmerged PR branch —
      # rev-only fetches work only where the server allows SHA-in-want),
      # and the pinned rev guarantees the checked tree is exactly the
      # event head even if the branch has moved.
      - name: nix flake check
        run: |
          set -euo pipefail
          read -r headRepo headRef headSha < <(/usr/bin/python3 - <<'PY'
          import json
          import os
          import re
          import sys

          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          head = ev["pull_request"]["head"]
          repo = head["repo"]["full_name"]
          ref = head["ref"]
          sha = head["sha"]
          if not re.fullmatch(r"[A-Za-z0-9._-]+/[A-Za-z0-9._-]+", repo):
              sys.exit("refusing suspicious head repo: %r" % repo)
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]*", ref) or ".." in ref:
              sys.exit("refusing suspicious head ref: %r" % ref)
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              sys.exit("refusing suspicious head sha: %r" % sha)
          print(repo, ref, sha)
          PY
          )
          echo "checking ${headRepo} @ ${headRef} = ${headSha}"
          exec /nix/var/nix/profiles/default/bin/nix flake check -L \
            "git+${{ github.server_url }}/${headRepo}.git?ref=${headRef}&rev=${headSha}"
